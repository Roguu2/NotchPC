<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0b0b0d">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>NotchPC</title>
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/icon.png">
<link rel="apple-touch-icon" href="/icon.png">
<link rel="stylesheet" href="/app.css">
</head>
<body>
<header>
  <img src="/icon.png" alt="" class="logo">
  <div class="who"><b>NotchPC</b><span id="pc"></span></div>
  <span id="status" class="dot" data-state="off"></span>
</header>

<main>
  <section id="welcome" class="screen center">
    <img src="/icon.png" alt="" class="big-logo">
    <h1 data-t="welcomeTitle"></h1>
    <p data-t="welcomeText"></p>
    <p id="welcomeError" class="error" hidden></p>
  </section>

  <section id="touchpad" class="screen" hidden>
    <div id="pad"><span data-t="padHint"></span></div>
    <div class="row buttons">
      <button data-click="left" data-t="left"></button>
      <button id="drag" data-t="drag"></button>
      <button data-click="right" data-t="right"></button>
    </div>
  </section>

  <section id="keyboard" class="screen" hidden>
    <input id="typing" type="text" autocomplete="off" autocapitalize="off" spellcheck="false" enterkeyhint="send" data-tp="typeHere">
    <div class="keys">
      <button data-key="esc">Esc</button>
      <button data-key="tab">Tab</button>
      <button data-key="backspace">⌫</button>
      <button data-key="enter">↵</button>
      <button data-key="up">↑</button>
      <button data-key="delete">Del</button>
      <button data-key="left">←</button>
      <button data-key="down">↓</button>
      <button data-key="right">→</button>
      <button data-key="win">Win</button>
      <button data-key="ctrl+c">Ctrl C</button>
      <button data-key="ctrl+v">Ctrl V</button>
      <button data-key="ctrl+z">Ctrl Z</button>
      <button data-key="ctrl+a">Ctrl A</button>
      <button data-key="alt+tab">Alt Tab</button>
      <button data-key="win+d">Win D</button>
      <button data-key="home">Home</button>
      <button data-key="end">End</button>
    </div>
  </section>

  <section id="music" class="screen" hidden>
    <div class="card track">
      <div id="trackTitle" class="title"></div>
      <div id="trackArtist" class="muted"></div>
    </div>
    <div class="row transport">
      <button data-media="prev" class="round" aria-label="prev">⏮</button>
      <button data-media="playpause" class="round big" id="playBtn" aria-label="play">▶</button>
      <button data-media="next" class="round" aria-label="next">⏭</button>
    </div>
    <div class="card">
      <div class="row between"><span data-t="volume"></span><span id="volText" class="muted"></span></div>
      <input id="volume" type="range" min="0" max="100" step="1">
      <div class="row buttons">
        <button data-media="voldown">−</button>
        <button data-media="mute" id="muteBtn" data-t="mute"></button>
        <button data-media="volup">+</button>
      </div>
    </div>
  </section>

  <section id="apps" class="screen" hidden>
    <div id="appList" class="list"></div>
    <p id="appsEmpty" class="muted center-text" data-t="appsEmpty" hidden></p>
  </section>

  <section id="game" class="screen" hidden>
    <div class="card center">
      <div id="gameApp" class="muted"></div>
      <div id="gameFps" class="fps">—</div>
      <div class="muted small">FPS</div>
    </div>
    <div class="grid3">
      <div class="card stat"><span class="muted small">CPU</span><b id="gameCpu">—</b></div>
      <div class="card stat"><span class="muted small">GPU</span><b id="gameGpu">—</b></div>
      <div class="card stat"><span class="muted small">RAM</span><b id="gameRam">—</b></div>
    </div>
    <button id="overlayBtn" class="wide"></button>
    <p class="muted small" data-t="gameHint"></p>
  </section>

  <section id="slides" class="screen" hidden>
    <div class="row slidenav">
      <button data-key="left" class="huge" aria-label="prev">‹</button>
      <button data-key="right" class="huge" aria-label="next">›</button>
    </div>
    <div class="grid2">
      <button data-key="f5" data-t="slideStart"></button>
      <button data-key="shift+f5" data-t="slideCurrent"></button>
      <button data-key="b" data-t="slideBlack"></button>
      <button data-key="esc" data-t="slideEnd"></button>
    </div>
  </section>

  <section id="files" class="screen" hidden>
    <div class="card list">
      <b data-t="toPc"></b>
      <label class="pick"><input id="pick" type="file" multiple><span data-t="pickFiles"></span></label>
      <div id="uploads" class="list"></div>
    </div>
    <div class="card list">
      <div class="row between"><b data-t="fromPc"></b><button id="filesRefresh" class="mini" aria-label="refresh">↻</button></div>
      <div id="fileList" class="list"></div>
      <p id="filesEmpty" class="muted small" data-t="filesEmpty" hidden></p>
    </div>
    <div class="card list">
      <b data-t="clipboard"></b>
      <textarea id="clipText" rows="3" data-tp="clipHint"></textarea>
      <button id="clipSend" class="wide" data-t="clipSend"></button>
      <div class="row between"><span class="muted small" data-t="clipFromPc"></span><button id="clipsRefresh" class="mini" aria-label="refresh">↻</button></div>
      <div id="clipList" class="list"></div>
      <p id="clipsEmpty" class="muted small" data-t="clipsEmpty" hidden></p>
    </div>
    <p id="filesOff" class="muted center-text" data-t="filesOff" hidden></p>
  </section>

  <section id="power" class="screen" hidden>
    <div class="list">
      <button data-power="lock" data-t="lock"></button>
      <button data-power="sleep" data-t="sleep"></button>
      <button data-power="restart" data-t="restart"></button>
      <button data-power="shutdown" data-t="shutdown" class="danger"></button>
      <button data-power="cancel" data-t="cancelPower"></button>
    </div>
    <p class="muted small" id="powerHint"></p>
    <button id="forget" class="link" data-t="forget"></button>
  </section>
</main>

<nav id="tabs" hidden>
  <button data-tab="touchpad"><svg viewBox="0 0 24 24"><rect x="4" y="3" width="16" height="13" rx="3"/><path d="M4 19h7M13 19h7"/></svg><span data-t="tabPad"></span></button>
  <button data-tab="keyboard"><svg viewBox="0 0 24 24"><rect x="2" y="6" width="20" height="12" rx="2"/><path d="M6 10h.01M10 10h.01M14 10h.01M18 10h.01M7 14h10"/></svg><span data-t="tabKeys"></span></button>
  <button data-tab="music"><svg viewBox="0 0 24 24"><path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/></svg><span data-t="tabMusic"></span></button>
  <button data-tab="apps"><svg viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg><span data-t="tabApps"></span></button>
  <button data-tab="game"><svg viewBox="0 0 24 24"><path d="M6 11h4M8 9v4M15 12h.01M18 10h.01"/><path d="M17.3 5H6.7a4 4 0 0 0-4 3.6L2 15a3 3 0 0 0 5.2 2l1.6-2h6.4l1.6 2A3 3 0 0 0 22 15l-.7-6.4a4 4 0 0 0-4-3.6z"/></svg><span data-t="tabGame"></span></button>
  <button data-tab="slides"><svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="12" rx="2"/><path d="M12 16v4M8 20h8"/></svg><span data-t="tabSlides"></span></button>
  <button data-tab="files"><svg viewBox="0 0 24 24"><path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><path d="M14 3v5h5M12 18v-6M9 15l3-3 3 3"/></svg><span data-t="tabFiles"></span></button>
  <button data-tab="power"><svg viewBox="0 0 24 24"><path d="M12 2v10"/><path d="M18.4 6.6a9 9 0 1 1-12.8 0"/></svg><span data-t="tabPower"></span></button>
</nav>

<div id="toast" hidden></div>
<script src="/app.js"></script>
</body>
</html>
